<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>第0课练手 · 点击计数器（修正版）</title>
</head>
<body>
    <h1 id="count">0</h1>
    <button id="btn">点我 +1（已点 0 次）</button>
    <button id="btn2">点我 -1</button>
    <script>
        let n = 0;
        const h1 = document.querySelector('#count');
        const btn = document.querySelector('#btn');
        const btn2 = document.querySelector('#btn2');

        // 数字一变就要做的事，收成一个函数，两个按钮都调它
        function show() {
            h1.textContent = n;              // 文字内容
            if (n < 0) {
                h1.style.color = 'red';      // 样式
            } else {
                h1.style.color = 'black';    // 回到正数要变回黑，不然一直是红的
            }
            // 模板字符串只能写在 JS 里，HTML 不认识反引号
            btn.textContent = `点我 +1（已点 ${n} 次）`;
        }

        btn.addEventListener('click', function(){
            n = n + 1;
            show();
        });
        btn2.addEventListener('click', function(){
            n = n - 1;
            show();
        });
    </script>
</body>
</html>
